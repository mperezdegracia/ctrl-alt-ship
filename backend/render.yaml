services:
  - type: web
    name: ctrl-alt-ship
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: DASHBOARD_ORIGINS
        sync: false
