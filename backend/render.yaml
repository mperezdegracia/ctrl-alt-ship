services:
  - type: web
    name: ctrl-alt-ship
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_OPERATION_TOOLS_ENABLED
        # Requires migration 20260830010000_client_operation_tools.sql.
        value: "true"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: DASHBOARD_ORIGINS
        sync: false
      - key: EMAIL_DELIVERY_MODE
        value: preview
      - key: EMAIL_WORKER_ENABLED
        value: "false"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMS_DELIVERY_MODE
        value: twilio
      - key: SMS_WORKER_ENABLED
        value: "true"
      - key: SMS_WORKER_POLL_INTERVAL_MS
        value: "5000"
